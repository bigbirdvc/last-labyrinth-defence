<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Labyrinth Defence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, ancient, idle — a stone labyrinth under siege, watched not played
   IDEA: the Last Labyrinth board itself, now with towers in the empty dark between corridors
   PICTURE: the live maze canvas, filling the screen
   COLOUR and TYPE: deep umber ground, ochre paving, explorer colours as accents; Pixelify Sans
   LAYOUT: board left, slim ledger right; stacks under 760px */
:root{color-scheme:dark;--bg:#1d1611;--panel:#2a2019;--ink:#f3e6cc;--dim:#b59f7f;--line:#4a3a2c;--hot:#eed080}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Pixelify Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100vh}
.board{position:relative;background:radial-gradient(ellipse at center,#2b2018 0%,#140f0b 80%)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.side{background:var(--panel);border-left:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
h1{font-size:26px;line-height:1.05;margin:0;font-weight:700;color:var(--hot)}
.lv{display:flex;justify-content:space-between;align-items:baseline}
.lv b{font-size:34px;line-height:1}
.sub{color:var(--dim);font-size:13px}
.bar{height:12px;background:#120d09;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#ee9a6a,#c8553a);transition:width .2s}
.ex{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:#221a14;border-left:4px solid}
.ex img{width:32px;height:32px;image-rendering:pixelated}
.ex .n{font-weight:600}.ex .s{font-size:22px;font-weight:700;text-align:right;line-height:1}
.ex .k{font-size:12px;color:var(--dim)}
.ex.lead{background:#33271c}
.msg{min-height:44px;font-size:14px;color:var(--hot)}
.prev{display:flex;gap:6px;flex-wrap:wrap}.prev span{background:#221a14;border:1px solid var(--line);padding:2px 8px;border-radius:10px;font-size:13px}
.btns{display:flex;gap:8px;margin-top:auto}
button{font:inherit;color:var(--ink);background:#3a2c20;border:1px solid var(--line);border-radius:6px;min-height:44px;padding:0 14px;cursor:pointer;flex:1}
button[aria-pressed=true]{background:#5a4128;border-color:var(--hot)}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.test{background:#221a14;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}.test summary{cursor:pointer;color:var(--hot)}
.test label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.test select{font:inherit;font-size:14px;background:#3a2c20;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px;max-width:60%}
.jumps{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.jumps button{flex:0 0 auto;min-height:34px;padding:0 10px}
canvas{touch-action:none;cursor:grab}
@media(max-width:760px){.wrap{grid-template-columns:1fr;height:auto}.board{height:62vh}.side{border-left:0;border-top:2px solid var(--line)}}
</style></head><body>
<div class="wrap">
<div class="board"><canvas id="c"></canvas></div>
<aside class="side">
<h1>Last Labyrinth Defence</h1>
<div class="lv"><div><span class="sub">Level</span><br><b id="lvl">1</b></div><div style="text-align:right"><span class="sub">Era</span><br><b id="era" style="font-size:22px">1</b></div></div>
<div><div class="lv sub"><span>Exit</span><span id="coreT"></span></div><div class="bar"><i id="core"></i></div></div>
<div id="exs" style="display:grid;gap:6px"></div>
<div><div class="sub">Next wave</div><div class="prev" id="prev"></div></div>
<div class="msg" id="msg"></div>
<div class="sub" id="stats"></div>
<details class="test"><summary>Test panel</summary>
<label>Maze type <select id="t_style"><option value="original">Original (Open branches)</option><option value="corridors">Long corridors</option><option value="twisty">Twisty</option><option value="grid">Classic grid</option></select></label>
<label>New towers <select id="t_rate"><option value="rare">Rare</option><option value="occasional">Occasional</option><option value="often">Often</option></select></label>
<label>Max towers each <select id="t_cap"><option value="auto">Auto (grows slowly)</option><option value="3">3</option><option value="6">6</option><option value="12">12</option><option value="24">24</option></select></label>
<div class="jumps">Jump to level <button data-jump="1">1</button><button data-jump="100">100</button><button data-jump="200">200</button><button data-jump="500">500</button><button data-jump="1000">1000</button><button data-jump="2500">2500</button></div>
</details>
<div class="btns"><button id="spd" aria-pressed="false">Speed 1×</button><button id="sfx" aria-pressed="false">SFX</button></div>
</aside>
</div>

const G=()=>Math.pow(1.05,level);
function waveFor(L){const w=[],n=6+Math.floor(L/10);
 for(let i=0;i<n;i++)w.push(L>=6&&i%4===3?'knight':'grunt');
 if(L>=3)for(let i=0;i<Math.ceil(n/2);i++)w.push('rat');
 if(L>=12&&L%3===0)for(let i=0;i<3;i++)w.push('bat');
 if(L%10===0)w.push('mino');return w}
function preview(L){const c={};for(const t of waveFor(L))c[t]=(c[t]||0)+1;const nm={grunt:'Grunt',rat:'Rat',knight:'Knight',bat:'Bat',mino:'Minotaur'};return Object.entries(c).map(([t,n])=>`<span>${nm[t]} ×${n}</span>`).join('')}
function startWave(){const list=waveFor(level);let t=0.5;queue=list.map((type,i)=>({type,gate:i%4,t:t+=type==='rat'?0.35:0.8}));phase='wave';leaks=0;visited=new Set();finished=[new Set(),new Set(),new Set(),new Set()];EX.forEach(e=>e.kills=0)}
function spawn(s){const T=ET[s.type],g=gates[s.gate],c=cells[g],hp=20*G()*T.hp;
 enemies.push({type:s.type,T,hp,max:hp,gate:s.gate,cell:g,from:g,to:g,t:1,x:c.x,y:c.y,stack:[],seen:new Set([g]),slow:0,fly:T.fly,fx:c.x,fy:c.y,prog:dist[g]})}
// ---------- simulation ----------
function choose(e){const i=e.cell;if(i===exit){leak(e);return}
 if(pits.get(i)==='open'&&!e.fly){pits.set(i,'sealed');e.dead=1;fx.push({k:'pit',x:cells[i].x,y:cells[i].y,t:.6});msg=`A ${e.type==='mino'?'minotaur':e.type} fell into a pit. It seals.`;beep(90,.15);return}
 const opts=nb(i).filter(j=>!e.seen.has(j)&&!finished[e.gate].has(j));
 let next;if(opts.length){next=R()<.5?opts.reduce((x,y)=>dist[y]<dist[x]?y:x):pick(opts);e.stack.push(i)}else{finished[e.gate].add(i);next=e.stack.pop();if(next===undefined)next=i}
 e.known=visited.has(next);visited.add(next);e.seen.add(next);e.from=i;e.to=next;e.t=0}
function leak(e){e.dead=1;const dmg=1;core-=dmg;leaks+=dmg;fx.push({k:'leak',t:.5});beep(60,.25);msg=`${e.type==='mino'?'The minotaur':'An enemy'} reached the core!`}
function step(dt){
 if(phase==='build'){phaseT-=dt;if(phaseT<=0)startWave();return}
 if(phase==='fallen'){phaseT-=dt;if(phaseT<=0)endLevel();return}
 for(const s of queue)s.t-=dt;while(queue.length&&queue[0].t<=0)spawn(queue.shift());
 for(const e of enemies){if(e.dead)continue;const sp=0.55*e.T.sp*(e.slow>0?.6:1);e.slow-=dt;
  if(e.fly){const E=cells[exit],dx=E.x-e.x,dy=E.y-e.y,d=Math.hypot(dx,dy);if(d<.1){leak(e);continue}const m=Math.min(d,sp*1.3*dt);e.x+=dx/d*m;e.y+=dy/d*m;e.prog=d;continue}
  e.t+=sp*(e.known?3:1)*dt;if(e.t>=1){e.cell=e.to;e.x=cells[e.cell].x;e.y=cells[e.cell].y;choose(e)}else{const a=cells[e.from],b=cells[e.to];e.x=a.x+(b.x-a.x)*e.t;e.y=a.y+(b.y-a.y)*e.t}
  e.prog=dist[e.to]-(e.t<1?0:0)}
 for(let i=towers.length-1;i>0;i--){const j=(R()*(i+1))|0;[towers[i],towers[j]]=[towers[j],towers[i]]}
 for(const t of towers){t.cd-=dt;if(t.cd>0)continue;const T=TT[t.type],r2=T.r*T.r,dm=T.d*Math.pow(1.6,t.lvl-1);
  const inR=enemies.filter(e=>!e.dead&&(T.air||!e.fly)&&(e.x-t.x)**2+(e.y-t.y)**2<=r2);if(!inR.length)continue;t.cd=1/T.f;
  if(T.aoe){for(const e of inR){hit(e,dm,t);e.slow=1}fx.push({k:'ring',x:t.x,y:t.y,r:T.r,c:EX[t.o].c,t:.3})}
  else{const e=T.mode==='strongest'?inR.reduce((a,b)=>b.hp>a.hp?b:a):inR.reduce((a,b)=>b.prog<a.prog?b:a);hit(e,T.pierce?dm/(1-(e.T.ar||0)):dm,t);fx.push({k:'shot',x:t.x,y:t.y,x2:e.x,y2:e.y,c:EX[t.o].c,t:.15})}}
 enemies=enemies.filter(e=>!e.dead);
 if(core<=0){collapse();return}
 if(!queue.length&&!enemies.length)endLevel()}
function hit(e,d,t){if(e.dead)return;e.hp-=d*(1-(e.T.ar||0));if(e.hp<=0){e.dead=1;const ex=EX[t.o];ex.kills++;ex.total++;totalKills++;const g=2.2*G()*e.T.b;EX.forEach(x=>x.gold+=g/4);fx.push({k:'pop',x:e.x,y:e.y,c:ex.c,t:.4});if(R()<.3)beep(520+R()*200,.04)}}
function collapse(){phase='fallen';phaseT=1.6;attempt++;msg=`An enemy reached the exit! Level ${level} starts again (attempt ${attempt}).`;beep(50,.6);
 for(const e of enemies)e.dead=1;enemies=[];queue=[]}
function endLevel(){
 if(phase==='fallen'){build();phase='build';phaseT=1.2;core=CORE;return} // retry the same level: enemies forget everything
 {
  const sum=EX.reduce((a,e)=>a+e.kills,0);let r=R()*sum,w=EX[0];for(const e of EX){r-=e.kills;if(r<=0){w=e;break}}const top=w.kills; // lucky draw weighted by kills
  if(top>0){w.score++;msg=`${w.n} wins level ${level} (${top} of ${sum} kills)${attempt>1?` (attempt ${attempt})`:''}.`}
  const bonus=10*G();EX.forEach(x=>x.gold+=bonus/4);beep(660,.12)}
 level++;attempt=1;grow();analyse();build();phase='build';phaseT=1.2;core=CORE}
function build(){ // each explorer draws 3 good spots (same spot = 50/50 duel), then levels up its weakest towers
 const RATE={rare:.07,occasional:.2,often:.5}[S.rate]??.2;
 const cap=S.cap==='auto'?2+Math.floor(Math.sqrt(level)/2):+S.cap;
 const near=s=>{for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)if(tmap.has(key(s.x+dx,s.y+dy)))return true;return false};
 for(let tries=0;tries<(arguments[0]||1);tries++){const picks=[];let free=spots.filter(s=>!tmap.has(s.k)&&!near(s)).slice(0,30);if(free.length<4)free=spots.filter(s=>!tmap.has(s.k)).slice(0,30);if(!free.length)break;
  for(let o=0;o<4;o++){const ex=EX[o],n=towers.filter(t=>t.o===o).length;if(n>=cap||ex.gold<BUILD||(n>0&&R()>RATE))continue;
   const draw=[pick(free),pick(free),pick(free)].sort((a,b)=>b.score-a.score);picks.push({o,s:draw[0]})}
  const by=new Map();for(const p of picks){if(!by.has(p.s.k))by.set(p.s.k,[]);by.get(p.s.k).push(p)}
  for(const[k,ps]of by){const w=pick(ps);if(ps.length>1)msg=`${ps.map(p=>EX[p.o].n).join(' & ')} wanted the same spot — ${EX[w.o].n} won the 50/50.`;
   EX[w.o].gold-=BUILD;const t={x:w.s.x,y:w.s.y,k,o:w.o,type:pick(Object.keys(TT)),lvl:1,cd:0};towers.push(t);tmap.set(k,t)}}
 for(let o=0;o<4;o++){const ex=EX[o],mine=towers.filter(t=>t.o===o);if(!mine.length)continue;
  for(let n=0;n<5000;n++){let lo=mine[0];for(const t of mine)if(t.lvl<lo.lvl||(t.lvl===lo.lvl&&R()<.3))lo=t;const c=upCost(lo);if(c>ex.gold)break;ex.gold-=c;lo.lvl++}}}
// ---------- sound ----------
let ac=null;function beep(f,d){if(!sfx)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(_){}}
// ---------- drawing ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let view={s:30,ox:0,oy:0};
const cam={zoom:1,cx:0,cy:0};
function fit(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 // like the original: show at least a 75 x 100 tile field (long side along the screen's long side), centred on the core
 const side=boundSide()+4,lo=Math.max(75,side),hi=Math.max(100,side),land=cv.width>=cv.height;let fw=land?hi:lo,fh=land?lo:hi;
 if(level<70){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of cells){a=Math.min(a,Math.abs(p.x));b=Math.min(b,Math.abs(p.y));c=Math.max(c,Math.abs(p.x));d=Math.max(d,Math.abs(p.y))}
  const bw=Math.max(9,2*c+5),bh=Math.max(9,2*d+5),t=Math.max(0,Math.min(1,(level-50)/20)),k=t*t*(3-2*t);fw=bw+(fw-bw)*k;fh=bh+(fh-bh)*k} // close-up early, original scale from level 70
 view.fit=Math.min(cv.width/fw,cv.height/fh);view.s=view.fit*cam.zoom;view.ox=cv.width/2-(cam.cx+.5)*view.s;view.oy=cv.height/2-(cam.cy+.5)*view.s}
const P=(x,y)=>[view.ox+x*view.s,view.oy+y*view.s];
function drawEnemy(e){const[px,py]=P(e.x,e.y),s=view.s,m=s/2;if(s<10){const z=Math.max(3,s*(e.T.boss?1.2:.7));ctx.fillStyle=e.T.boss?'#ff5a3a':'#e8483a';ctx.fillRect(px+m-z/2,py+m-z/2,z,z);return}const T=e.T,z=T.boss?s*.85:T===ET.rat?s*.38:s*.55;const cx=px+m,cy=py+m;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(cx-z/2,cy+z*.35,z,z*.18);
 ctx.fillStyle=T.col;
 if(e.fly){const f=Math.sin(performance.now()/90)*z*.2;ctx.fillRect(cx-z/2,cy-z/4+f,z*.35,z*.2);ctx.fillRect(cx+z*.15,cy-z/4+f,z*.35,z*.2);ctx.fillRect(cx-z/6,cy-z/3,z/3,z/2)}
 else{ctx.fillRect(cx-z/2,cy-z/2,z,z);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(cx-z/2,cy-z/2,z,z*.18);
  if(T.ar){ctx.fillStyle='#5b6170';ctx.fillRect(cx-z/2,cy-z*.15,z,z*.14)}
  if(T.boss){ctx.fillStyle='#e8d7b0';ctx.fillRect(cx-z*.62,cy-z*.62,z*.2,z*.3);ctx.fillRect(cx+z*.42,cy-z*.62,z*.2,z*.3)}
  ctx.fillStyle='#120d09';ctx.fillRect(cx-z*.25,cy-z*.2,z*.14,z*.14);ctx.fillRect(cx+z*.11,cy-z*.2,z*.14,z*.14)}
 const w=s*.8;ctx.fillStyle='#120d09';ctx.fillRect(px+s*.1,py-s*.08,w,s*.08);ctx.fillStyle=e.hp/e.max>.5?'#8fd16a':'#e0763c';ctx.fillRect(px+s*.1,py-s*.08,w*Math.max(0,e.hp/e.max),s*.08)}
function drawTower(t){const[px,py]=P(t.x,t.y),s=view.s,ex=EX[t.o];if(s<10){const z=Math.max(4,s*.9);ctx.fillStyle='#120d09';ctx.fillRect(px+s/2-z/2-1,py+s/2-z/2-1,z+2,z+2);ctx.fillStyle=ex.c;ctx.fillRect(px+s/2-z/2,py+s/2-z/2,z,z);return}
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(px+s*.12,py+s*.78,s*.76,s*.14);
 ctx.fillStyle='#3b2e24';ctx.fillRect(px+s*.15,py+s*.45,s*.7,s*.4);ctx.fillStyle=ex.c;ctx.fillRect(px+s*.15,py+s*.45,s*.7,s*.08);
 const g={bolt:'#ffe9a8',ring:'#c7f0ff',pierce:'#ff9bd0',smash:'#ffb37a'}[t.type];ctx.fillStyle=g;
 if(t.type==='ring'){ctx.fillRect(px+s*.3,py+s*.6,s*.4,s*.08)}else if(t.type==='bolt'){ctx.fillRect(px+s*.46,py+s*.55,s*.08,s*.25)}else if(t.type==='pierce'){ctx.fillRect(px+s*.3,py+s*.64,s*.4,s*.06);ctx.fillRect(px+s*.6,py+s*.58,s*.1,s*.18)}else{ctx.fillRect(px+s*.38,py+s*.58,s*.24,s*.2)}
 ctx.drawImage(IM[ex.k],px+s*.18,py-s*.12,s*.64,s*.64);
 for(let i=0;i<Math.min(t.lvl-1,5);i++){ctx.fillStyle=ex.c;ctx.fillRect(px+s*(.18+i*.13),py+s*.9,s*.09,s*.07)}
 if(t.lvl>6){ctx.fillStyle=ex.c;ctx.font=`${Math.max(9,s*.22)}px Pixelify Sans`;ctx.fillText(t.lvl,px+s*.72,py+s*.98)}}
function draw(){fit();ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);const s=view.s,p=pal[(level*7)%pal.length]||{u:IM.u,v:IM.v};
 cells.forEach((c,i)=>{const[x,y]=P(c.x,c.y);if(pits.has(i)){ctx.drawImage(pits.get(i)==='open'?IM.po:IM.ps,x,y,s,s);return}
  if(x>cv.width||y>cv.height||x<-s||y<-s)return;if(s<6){ctx.fillStyle=visited.has(i)?'#eed080':'#aa8b67';ctx.fillRect(x,y,Math.ceil(s),Math.ceil(s));return}
  ctx.drawImage(visited.has(i)?p.v:p.u,x,y,s,s);let fin=false;for(const f of finished)if(f.has(i))fin=true;if(fin){ctx.fillStyle='rgba(40,25,10,.35)';ctx.fillRect(x,y,s,s)}});
 gates.forEach(g=>{const[x,y]=P(cells[g].x,cells[g].y),z=Math.max(s,8);ctx.drawImage(IM.en,x+s/2-z/2,y+s/2-z/2,z,z)});
 {const[x0,y0]=P(cells[exit].x,cells[exit].y),z=Math.max(s,12),x=x0+s/2-z/2,y=y0+s/2-z/2;ctx.drawImage(IM.ex,x,y,z,z);ctx.strokeStyle=core>CORE*.4?'#eed080':'#e0763c';ctx.lineWidth=Math.max(2,z*.07);ctx.beginPath();ctx.arc(x+z/2,y+z/2,z*.62,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,core)/CORE);ctx.stroke()}
 towers.forEach(drawTower);enemies.forEach(drawEnemy);
 for(const f of fx){ctx.globalAlpha=Math.min(1,f.t*4);if(f.k==='shot'){const[a,b]=P(f.x+.5,f.y+.1),[c,d]=P(f.x2+.5,f.y2+.5);ctx.strokeStyle=f.c;ctx.lineWidth=Math.max(1.5,s*.06);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
  else if(f.k==='ring'){const[a,b]=P(f.x+.5,f.y+.5);ctx.strokeStyle=f.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(a,b,f.r*s*(1-f.t*2),0,7);ctx.stroke()}
  else if(f.k==='pop'){const[a,b]=P(f.x+.5,f.y+.5);ctx.fillStyle=f.c;for(let i=0;i<6;i++){const an=i*1.047,r=s*(.5-f.t)*1.2;ctx.fillRect(a+Math.cos(an)*r,b+Math.sin(an)*r,s*.1,s*.1)}}
  else if(f.k==='leak'){ctx.fillStyle='rgba(200,60,40,.25)';ctx.fillRect(0,0,cv.width,cv.height)}}
 ctx.globalAlpha=1;if(phase==='fallen'){ctx.fillStyle='rgba(20,10,5,.55)';ctx.fillRect(0,0,cv.width,cv.height)}}
// ---------- HUD ----------
const $=id=>document.getElementById(id);
$('exs').innerHTML=EX.map((e,i)=>`<div class="ex" id="ex${i}" style="border-color:${e.c}"><img src="data:image/png;base64,${SP[e.k]}" alt=""><div><div class="n">${e.n}</div><div class="k" id="exk${i}"></div></div><div class="s" id="exs${i}">0</div></div>`).join('');
let lastPrev=-1;
function hud(){$('lvl').textContent=level;$('era').textContent=Math.floor((level-1)/250)+1;$('core').style.width=Math.max(0,core/CORE*100)+'%';$('coreT').textContent=`Attempt ${attempt}`;
 const top=Math.max(...EX.map(e=>e.score));EX.forEach((e,i)=>{$('exs'+i).textContent=e.score;$('exk'+i).textContent=`${e.kills} kills · ${towers.filter(t=>t.o===i).length} towers`;$('ex'+i).classList.toggle('lead',e.score===top&&top>0)});
 if(lastPrev!==level){$('prev').innerHTML=preview(phase==='build'?level:level+1);lastPrev=level}
 $('msg').textContent=msg;$('stats').textContent=`${cells.length} cells · ${towers.length} towers · enemy HP ×${G().toFixed(1)} · ${totalKills} kills`}
$('spd').onclick=()=>{speed=speed===1?4:speed===4?16:1;$('spd').textContent=`Speed ${speed}×`;$('spd').setAttribute('aria-pressed',speed>1)};
$('sfx').onclick=()=>{sfx=!sfx;$('sfx').setAttribute('aria-pressed',sfx);if(sfx)beep(440,.08)};
// ---------- boot, reset, jump ----------
function reset(T){cells.length=0;at.clear();towers=[];tmap.clear();enemies=[];queue=[];fx=[];visited=new Set();
 gro={tip:0,heading:0,remaining:0,boost:1,pending:null,nodes:[0]};level=1;core=CORE;adapt=1;totalKills=0;phase='build';phaseT=1.2;
 EX.forEach(e=>{e.score=0;e.kills=0;e.gold=60;e.total=0});attempt=1;core=CORE;add(0,0);exit=0;for(let i=0;i<9;i++)grow();analyse();build();
 while(level<T){level++;grow();if(level%10===0||level===T){analyse();const inc=(2.2*G()*(6+level/10)+10*G())*10;EX.forEach(x=>x.gold+=inc/4);build(10)}}
 analyse();cam.zoom=1;cam.cx=0;cam.cy=0;msg=T>1?`Jumped to level ${T}.`:'The labyrinth stirs.';lastPrev=-1}
{const m=/L=(\d+)/.exec(location.hash);reset(m?Math.min(5000,+m[1]):1)}
// zoom and pan: wheel, pinch, drag; double-click resets
{const pts=new Map();let pinch=0;
 const zoomAt=(px,py,f)=>{const dpr=devicePixelRatio||1;px*=dpr;py*=dpr;const gx=(px-view.ox)/view.s,gy=(py-view.oy)/view.s;cam.zoom=Math.max(1,Math.min(40,cam.zoom*f));const s=view.fit*cam.zoom;cam.cx=gx-.5-(px-cv.width/2)/s;cam.cy=gy-.5-(py-cv.height/2)/s;if(cam.zoom===1){cam.cx=0;cam.cy=0}};
 cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015))},{passive:false});
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});
 cv.addEventListener('pointermove',e=>{const o=pts.get(e.pointerId);if(!o)return;const dpr=devicePixelRatio||1;
  if(pts.size===1){cam.cx-=(e.clientX-o.x)*dpr/view.s;cam.cy-=(e.clientY-o.y)*dpr/view.s}
  else{const a=[...pts.values()];const d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const b=[...pts.values()];const d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y);const r=cv.getBoundingClientRect();if(d0>0)zoomAt((b[0].x+b[1].x)/2-r.left,(b[0].y+b[1].y)/2-r.top,d1/d0);return}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});
 const up=e=>pts.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('dblclick',()=>{cam.zoom=1;cam.cx=0;cam.cy=0})}
// test panel
{const save=()=>{try{localStorage.setItem('lld-settings',JSON.stringify(S))}catch(_){}};
 for(const id of['style','rate','cap']){const el=$('t_'+id);el.value=S[id];el.onchange=()=>{S[id]=el.value;save();if(id==='style')reset(level)}}
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>reset(+b.dataset.jump))}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(.25,(now-last)/1000)*speed;last=now;const dt=1/60;let n=0;while(acc>=dt&&n<2000){step(dt);acc-=dt;n++}
 for(const f of fx)f.t-=(now-last+16)/1000;fx=fx.filter(f=>f.t>0);if(fx.length>400)fx.splice(0,fx.length-400);draw();hud();requestAnimationFrame(loop)}
Promise.all(Object.values(IM).map(i=>i.decode().catch(()=>{}))).then(()=>{buildPalettes();requestAnimationFrame(loop)});
}
</script></body></html>
